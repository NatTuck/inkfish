# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Elixir CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

env:
  SHELL: /usr/bin/bash

jobs:
  build:

    name: Build and test
    runs-on: ubuntu-latest

    services:
      # Label used to access the service container
      postgres:
        # Docker Hub image
        image: postgres
        # Provide the password for postgres
        env:
          POSTGRES_USER: inkfish
          POSTGRES_PASSWORD: oobeiGait3ie
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          # Maps tcp port 5432 on service container to the host
          - 5432:5432

    steps:
    - uses: actions/checkout@v4
    - uses: actions-rust-lang/setup-rust-toolchain@v1
    - uses: pnpm/action-setup@v4
      with:
        package_json_file: assets/package.json
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
    - name: Set up Elixir
      uses: erlef/setup-beam@v1
      with:
        elixir-version: '1.19.5' # [Required] Define the Elixir version
        otp-version: '28.0'      # [Required] Define the Erlang/OTP version
    - name: Restore dependencies cache
      uses: actions/cache@v3
      with:
        path: deps
        key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
        restore-keys: ${{ runner.os }}-mix-
    - name: Install dependencies
      run: mix deps.get
    - name: Cache npm dependencies
      uses: actions/cache@v3
      with:
        path: assets/node_modules
        key: ${{ runner.os }}-npm-${{ hashFiles('assets/pnpm-lock.yaml') }}
    - name: Install npm dependencies
      run: pnpm install --dir assets
    - name: Run JS tests
      run: pnpm --dir assets test
    - name: Install Playwright browsers
      run: pnpm --dir assets exec playwright install chromium
    - name: Compile assets
      run: |
        mkdir -p priv/static/assets priv/static/images
        MIX_ENV=test mix phx.copy default
        MIX_ENV=test mix phx.copy bs_icons
        MIX_ENV=test mix phx.copy katex
        MIX_ENV=test mix esbuild default
        MIX_ENV=test mix sass default
    - name: Setup
      run: MIX_ENV=test mix ecto.setup
    - name: Allow unprivileged user namespaces
      run: |
        # The tmpfs sandbox creates an unprivileged user namespace with
        # `unshare -Urm`. ubuntu-latest is 24.04, where
        # kernel.apparmor_restrict_unprivileged_userns=1 restricts that to
        # processes with an AppArmor profile that permits it: `unshare -U` gets
        # EPERM and every tmpfs-dependent test fails. This is a VM, so the
        # fix is the sysctl, not a container seccomp profile.
        echo "before: apparmor_restrict_unprivileged_userns=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo absent)"

        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

        # Older kernels have this knob instead of the AppArmor one. It is absent
        # on 24.04, so its absence is not a failure -- but the check below is.
        sudo sysctl -w kernel.unprivileged_userns_clone=1 || true

        echo "after:  apparmor_restrict_unprivileged_userns=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo absent)"

        # Verify the mechanism actually works instead of trusting the sysctls: a
        # step that passes while leaving the sandbox broken is worse than a red
        # build. No `|| true`, and no falling back to skipping tests.
        if ! unshare -Urm -- true; then
          echo "::error::unprivileged user namespaces are still unavailable: 'unshare -Urm -- true' failed on this runner. Every tmpfs-dependent test (archive extraction, git clone) will fail."
          exit 1
        fi

        echo "unshare -Urm -- true: ok"
    - name: Run tests
      run: mix test
